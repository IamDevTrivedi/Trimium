name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  gate:
    runs-on: ubuntu-latest
    if: vars.SKIP_ACTIONS != 'true'
    steps:
      - run: echo "Gate passed — proceeding with CI/CD"

  check:
    runs-on: ubuntu-latest
    needs: [gate]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Run biome check
        run: bun run check

  detect-changes:
    runs-on: ubuntu-latest
    needs: [check]

    outputs:
      client: ${{ steps.changes.outputs.client }}
      server: ${{ steps.changes.outputs.server }}

    steps:
      - uses: actions/checkout@v6

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            client:
              - 'client/**'
            server:
              - 'server/**'
              - 'package.json'

  typecheck:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.server == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run server typecheck
        working-directory: server
        run: bun run typecheck

  deploy-client:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.client == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install Vercel CLI
        run: bun add -g vercel

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-server:
    runs-on: ubuntu-latest
    needs: [typecheck]
    if: needs.detect-changes.outputs.server == 'true'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: PROJECT_DIR,SERVER_DIR,HEALTH_CHECK_URL,HEALTH_RETRY_COUNT,HEALTH_RETRY_INTERVAL
          script: |
            set -euo pipefail

            # ── Environment setup ───────────────────────────────────────
            source ~/.bashrc 2>/dev/null || true

            # ── Constants ────────────────────────────────────────────
            PROJECT_DIR="/projects/Trimium"
            SERVER_DIR="$PROJECT_DIR/server"
            HEALTH_CHECK_URL="http://localhost:5003/api/v1/health"
            HEALTH_RETRY_COUNT=10
            HEALTH_RETRY_INTERVAL=5

            # ── Helpers ───────────────────────────────────────────────
            log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] $*"; }

            DEPLOY_START=$(date +%s)
            trap 'EXIT_CODE=$?; DEPLOY_END=$(date +%s); log "Exited with status $EXIT_CODE in $((DEPLOY_END - DEPLOY_START)) seconds."' EXIT

            log "===== Deployment started ====="

            # ── Pull latest code ──────────────────────────────────────
            log "Pulling latest code..."
            cd "$PROJECT_DIR"
            if ! git pull origin main; then
              log "ERROR: git pull failed. Aborting."
              exit 1
            fi
            log "Git pull complete."

            # ── Docker compose build → down → up ────────────────────────
            cd "$SERVER_DIR"

            log "Building Docker image..."
            docker compose build
            log "Build complete."

            log "Stopping existing containers..."
            docker compose down
            log "Down complete."

            log "Starting containers..."
            docker compose up -d
            log "Up complete."

            # ── Health check ──────────────────────────────────────────
            log "Running health checks ($HEALTH_RETRY_COUNT attempts)..."
            IS_HEALTHY=false

            for i in $(seq 1 "$HEALTH_RETRY_COUNT"); do
              log "Health check attempt $i/$HEALTH_RETRY_COUNT..."
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$HEALTH_CHECK_URL" || echo "000")
              if [ "$STATUS" -eq 200 ]; then
                IS_HEALTHY=true
                log "Health check passed on attempt $i."
                break
              fi
              log "Attempt $i/$HEALTH_RETRY_COUNT failed (status: $STATUS). Retrying in ${HEALTH_RETRY_INTERVAL}s..."
              sleep "$HEALTH_RETRY_INTERVAL"
            done

            # ── Success path ──────────────────────────────────────────
            if [ "$IS_HEALTHY" = true ]; then
              log "===== Deployment successful ====="
              exit 0
            fi

            # ── Failure path ──────────────────────────────────────────
            log "Health check failed. Tearing down..."
            docker compose down
            log "===== Deployment failed ====="
            exit 1
