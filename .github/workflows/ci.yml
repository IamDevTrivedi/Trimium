name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  gate:
    runs-on: ubuntu-latest
    if: vars.SKIP_ACTIONS != 'true'
    steps:
      - run: echo "Gate passed — proceeding with CI/CD"

  check:
    runs-on: ubuntu-latest
    needs: [gate]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Run biome check
        run: bun run check

  detect-changes:
    runs-on: ubuntu-latest
    needs: [check]

    outputs:
      client: ${{ steps.changes.outputs.client }}
      server: ${{ steps.changes.outputs.server }}

    steps:
      - uses: actions/checkout@v6

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            client:
              - 'client/**'
            server:
              - 'server/**'
              - 'package.json'

  typecheck:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.server == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run server typecheck
        working-directory: server
        run: bun run typecheck

  deploy-client:
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.client == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install Vercel CLI
        run: bun add -g vercel

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  build-image:
    runs-on: ubuntu-latest
    needs: [typecheck]
    if: needs.detect-changes.outputs.server == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/arm64
          push: true
          tags: ghcr.io/iamdevtrivedi/trimium-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-server:
    runs-on: ubuntu-latest
    needs: [build-image]
    if: needs.detect-changes.outputs.server == 'true'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: PROJECT_DIR,SERVER_DIR,HEALTH_CHECK_URL,HEALTH_RETRY_COUNT,HEALTH_RETRY_INTERVAL,IMAGE_BASE,CURRENT_TAG,LIVE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail

            # ── Environment setup ───────────────────────────────────────
            source ~/.bashrc 2>/dev/null || true

            # ── Constants ────────────────────────────────────────────
            PROJECT_DIR="/projects/Trimium"
            SERVER_DIR="$PROJECT_DIR/server"
            HEALTH_CHECK_URL="http://localhost:5003/api/v1/health"
            HEALTH_RETRY_COUNT=10
            HEALTH_RETRY_INTERVAL=5
            GHCR_USER="${{ github.actor }}"
            GHCR_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            IMAGE_BASE="ghcr.io/iamdevtrivedi/trimium-app"
            LATEST_TAG="${IMAGE_BASE}:latest"
            CURRENT_TAG="${IMAGE_BASE}:current"
            LIVE_TAG="${IMAGE_BASE}:live"

            # ── Helpers ───────────────────────────────────────────────
            log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] $*"; }

            DEPLOY_START=$(date +%s)
            trap 'EXIT_CODE=$?; DEPLOY_END=$(date +%s); log "Exited with status $EXIT_CODE in $((DEPLOY_END - DEPLOY_START)) seconds."' EXIT

            # Health check loop. Echoes "healthy" on success, "unhealthy" on failure.
            health_check() {
              local attempts="$1"
              for i in $(seq 1 "$attempts"); do
                log "Health check attempt $i/$attempts..."
                local status
                status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$HEALTH_CHECK_URL" || echo "000")
                if [ "$status" -eq 200 ]; then
                  log "Health check passed on attempt $i."
                  return 0
                fi
                log "Attempt $i/$attempts failed (status: $status). Retrying in ${HEALTH_RETRY_INTERVAL}s..."
                sleep "$HEALTH_RETRY_INTERVAL"
              done
              return 1
            }

            log "===== Deployment started ====="

            # ── Pull latest code (compose files, env, etc.) ────────────
            log "Pulling latest code..."
            cd "$PROJECT_DIR"
            if ! git pull origin main; then
              log "ERROR: git pull failed. Aborting."
              exit 1
            fi
            log "Git pull complete."

            cd "$SERVER_DIR"

            # ── Login to GHCR and pull the freshly built :latest image ─
            log "Logging in to GHCR..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            log "GHCR login complete."

            log "Pulling ${LATEST_TAG}..."
            if ! docker pull "$LATEST_TAG"; then
              log "ERROR: docker pull of :latest failed. Aborting."
              exit 1
            fi
            log "Image pull complete."

            # ── Move :current to :latest, so compose deploys the new build
            log "Tagging :current -> :latest..."
            docker tag "$LATEST_TAG" "$CURRENT_TAG"

            # ── Deploy :current and health-check ───────────────────────
            log "Stopping existing containers..."
            docker compose down
            log "Down complete."

            log "Starting containers with :current..."
            docker compose up -d
            log "Up complete."

            log "Running health checks against the new deploy..."
            if health_check "$HEALTH_RETRY_COUNT"; then
              # ── Happy path: promote :current to :live ────────────────
              log "Promoting :current to :live (deploy succeeded)..."
              docker tag "$CURRENT_TAG" "$LIVE_TAG"
              log "===== Deployment successful (exit 0) ====="
              exit 0
            fi

            # ── Sad path: health check failed. Roll back to :live ──────
            log "Health check failed on new deploy. Rolling back to :live..."

            if ! docker image inspect "$LIVE_TAG" >/dev/null 2>&1; then
              # No previous :live image to roll back to.
              log "ERROR: No :live image exists to roll back to. Leaving stack down."
              docker compose down
              log "===== Rollback failed (no previous image) (exit 2) ====="
              exit 2
            fi

            # :current <= :live
            log "Re-tagging :current to :live (rollback)..."
            docker tag "$LIVE_TAG" "$CURRENT_TAG"

            log "Restarting containers with previous :live image..."
            docker compose down
            docker compose up -d
            log "Rollback up complete."

            log "Running health checks against rolled-back deploy..."
            if health_check "$HEALTH_RETRY_COUNT"; then
              # ── SAD-1: rollback succeeded ───────────────────────────
              log "Rollback succeeded. :live is unchanged; new build was bad."
              log "===== Deployment failed, rollback succeeded (exit 1) ====="
              exit 1
            fi

            # ── SAD-2: rollback also failed ───────────────────────────
            log "ERROR: Rollback health check failed. Tearing down."
            docker compose down
            log "===== Deployment failed, rollback failed (exit 2) ====="
            exit 2
